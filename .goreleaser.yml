# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: xpcolor
    main: ./cmd/xpcolor
    binary: xpcolor
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/tolgayakar/xpcolor/internal/command.version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - ids:
      - xpcolor
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude:
      - "^Merge pull request"
